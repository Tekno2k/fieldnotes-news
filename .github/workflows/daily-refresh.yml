name: Fieldnotes Daily News Refresh

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: '0 8 * * *'
      timezone: 'America/Chicago'

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: fieldnotes-pages
  cancel-in-progress: false

jobs:
  refresh-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out Fieldnotes
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate site and install resilient RSS parser
        run: |
          python -m pip install --disable-pip-version-check "feedparser==6.0.12"
          python -m py_compile scripts/update_feed.py
          node --check enhancements.js
      - name: Collect fresh publisher stories
        run: |
          python scripts/update_feed.py || echo "Feeds unavailable; retaining saved snapshot."
      - name: Assemble public site
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp reader.css public/reader.css
          cp enhancements.js public/enhancements.js
          cp data/latest.json public/data/latest.json
          touch public/.nojekyll
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload web files
        uses: actions/upload-pages-artifact@v4
        with:
          path: public
      - name: Wait until Pages artifact appears in GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..20}; do
            if curl --silent --show-error --fail \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              | jq -e '[.artifacts[]? | select(.name == "github-pages" and .expired == false)] | length > 0' >/dev/null; then
              echo "Pages artifact is available to deploy."
              break
            fi
            if [[ "$attempt" -eq 20 ]]; then
              echo "::error::GitHub API has not indexed the uploaded Pages artifact after multiple checks."
              exit 1
            fi
            sleep 5
          done
          sleep 3
      - name: Deploy homepage
        id: deployment
        uses: actions/deploy-pages@v4
